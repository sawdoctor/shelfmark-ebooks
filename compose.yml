services:
  shelfmark-ebooks:
    image: ${SHELFMARK_IMAGE:-ghcr.io/calibrain/shelfmark:v1.4.0}
    restart: unless-stopped

    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
      SEARCH_PAGE_TITLE: ${SEARCH_PAGE_TITLE:-Shelfmark eBooks}
      SUPPORTED_FORMATS: ${SUPPORTED_FORMATS:-epub,pdf}
      BOOK_LANGUAGE: ${BOOK_LANGUAGE:-en}
      DEFAULT_CONTENT_TYPE: ebook
      BOOKS_OUTPUT_MODE: folder
      INGEST_DIR: /books
      FILE_ORGANIZATION: ${FILE_ORGANIZATION:-organize}
      PROWLARR_ENABLED: "true"
      PROWLARR_URL: ${PROWLARR_URL:-http://prowlarr:9696}
      PROWLARR_API_KEY: ${PROWLARR_API_KEY:-}
      PROWLARR_AUTO_EXPAND: "false"
      PROWLARR_USENET_CLIENT: sabnzbd
      SABNZBD_URL: ${SABNZBD_URL:-http://sabnzbd:8080}
      SABNZBD_API_KEY: ${SABNZBD_API_KEY:-}
      SABNZBD_CATEGORY: ${SABNZBD_CATEGORY:-books}
      PROWLARR_USENET_ACTION: ${PROWLARR_USENET_ACTION:-move}
      CUSTOM_SCRIPT: /custom-scripts/epub-series-fix.py
      CUSTOM_SCRIPT_PATH_MODE: absolute
      CUSTOM_SCRIPT_JSON_PAYLOAD: "true"

    ports:
      - "${SHELFMARK_PORT:-8086}:8084"

    volumes:
      - ${SHELFMARK_CONFIG_DIR:-./config}:/config
      - ${EBOOK_LIBRARY_DIR:-./books}:/books
      - ${SAB_DOWNLOADS_DIR:-./downloads}:/downloads
      - ./scripts:/custom-scripts:ro
